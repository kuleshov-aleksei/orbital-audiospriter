# Load brotli modules
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enable brotli compression
    brotli on;
    brotli_types text/html text/css application/javascript application/json image/svg+xml application/wasm;
    brotli_min_length 1000;
    brotli_comp_level 6;

    server {
        listen 8000;
        server_name _;

        # Root must live at server level so regex locations inherit it
        # (regex locations only inherit from server/http, NOT from location /)
        root /usr/share/nginx/html;

        # SPA fallback (PWA)
        location / {
            try_files $uri $uri/ /index.html;

            # Serve pre-compressed brotli files (.br) - preferred
            brotli_static on;
            # Serve pre-compressed gzip files (.gz) - fallback for older browsers
            gzip_static on;
        }

        # ffmpeg.wasm core is ~24MB; allow large static files (no body limit for GET)
        location /ffmpeg/ {
            root /usr/share/nginx/html;
            # WASM served as application/wasm via mime.types
        }

        # Cache hashed static assets for 1 month
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML (always fresh for PWA updates)
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
